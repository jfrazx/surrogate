name: Check for TypeScript build errors

on:
  push:
    branches: [master, develop]

  pull_request:
    branches: [master, develop]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  run-tsc:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Github checkout
        uses: actions/checkout@v7
      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tsc
        run: npm run compile --noEmit --noErrorTruncation

  pack-check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Github checkout
        uses: actions/checkout@v7
      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Pack
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/*.tgz)" >> "$GITHUB_ENV"
      - name: Run publint
        run: npx publint --strict "$TARBALL"
      - name: Run attw
        run: npx attw "$TARBALL"
      - name: Install into ESM consumer
        working-directory: test/fixtures/esm-consumer
        run: npm install --no-save --no-package-lock "$TARBALL"
      - name: Typecheck ESM consumer
        run: npx tsc -p test/fixtures/esm-consumer
      - name: Run ESM consumer
        run: node test/fixtures/esm-consumer/smoke.mjs
